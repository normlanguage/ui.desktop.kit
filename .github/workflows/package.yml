name: Package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: normlanguage/registry/.github/actions/setup-norm@d229852448570c786a3f86e62c7db36769ed9a18
        with:
          source-ref: 0ab66c108ee77d8a3f16f85f51499aaaaff15943
      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: 25.0.2
      - uses: actions/checkout@v7
        with:
          repository: normlanguage/ui
          ref: v10
          path: .tmp/ui
      - name: Build component artifact
        shell: pwsh
        run: |
          ./gradlew.bat publish '-PuiRoot=.tmp/ui' --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cache = Join-Path $HOME '.norm/cache/maven'
          New-Item -ItemType Directory -Force $cache | Out-Null
          Copy-Item -Path build/repository/* -Destination $cache -Recurse -Force
      - name: Generate repository Skill
        shell: pwsh
        run: norm docs ui/desktop/kit --output build/api --skill SKILL.md
      - uses: normlanguage/registry/.github/actions/package-module@77a26aef21f97b65c6343faf621412d91fed7a92
        id: package
        with:
          module-path: ui/desktop/kit
          cache-directory: ~/.norm/cache/packages/github
      - name: Verify JavaFX components and theme rendering
        shell: pwsh
        run: |
          ./gradlew.bat test '-PuiRoot=.tmp/ui' --console=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify component lifecycle and gallery
        shell: bash
        run: |
          timeout 300 norm test ui/desktop/kit --filter ui.desktop.kit.test.tabs
          timeout 300 norm test ui/desktop/kit --filter ui.desktop.kit.test.creation
          timeout 300 norm test ui/desktop/kit --filter ui.desktop.kit.test.inputs
          timeout 300 norm test ui/desktop/kit --filter ui.desktop.kit.test.display
          timeout 300 norm test samples/tasks
          timeout 300 norm test samples/orders
          timeout 300 norm test samples/jobs
          timeout 300 norm test samples/gallery --filter gallery.test.catalog
          timeout 300 norm test samples/gallery --filter gallery.test.rendering
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-screenshots
          path: build/screenshots/norm
      - uses: normlanguage/registry/.github/actions/publish-module@77a26aef21f97b65c6343faf621412d91fed7a92
        with:
          archive: ${{ steps.package.outputs.archive }}
          version: ${{ steps.package.outputs.version }}


