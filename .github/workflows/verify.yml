name: Verify JavaFX components

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javafx:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - LifecycleTest
          - LayoutNavigationTest
          - InputControlsTest
          - DisplayControlsTest
          - ImageResourceTest
          - UtilCaptureTest
          - FeedbackTest
          - ConfigurationTest
          - PropertyInvariantTest
          - WatermarkTest
          - MotionTest
          - CardLayoutTest
          - NavigationLayoutAdapterTest
          - InputAdapterTest
          - DisplayAdapterTest
          - DisplayStateLinkTest
          - FeedbackContentTest
          - NoticeHostTest
          - OverlayAdapterTest
          - OverlayLifecycleTest
          - SelectionLinkTest
          - ValueLinkTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: normlanguage/ui
          ref: 8c37621cb864e1eaf8376dc44e926727e9e15ffd
          path: .tmp/ui
      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: 25.0.2
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify ${{ matrix.suite }}
        shell: pwsh
        run: .\gradlew.bat test '-PuiRoot=.tmp/ui' -PtestSource=${{ matrix.suite }} --tests '*${{ matrix.suite }}' --console=plain
